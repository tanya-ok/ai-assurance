[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-assurance"
version = "0.2.1"
description = "Source-verified project profiles and scoped evidence review"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Tanya Babitskaya"}]
dependencies = []

[project.scripts]
ai-assurance = "ai_assurance.cli:main"

[dependency-groups]
dev = ["ruff>=0.16.9,<0.17", "mypy>=2.3.1,<3", "hatchling>=1.27,<2"]
docs = ["zensical==0.0.65"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_assurance"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tools", "/bundle", "/source.json*", "/tests", "/scripts", "/profiles", "/docs", "/pyproject.toml", "/uv.lock", "/zensical.toml", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/.github", "/.gitleaks.toml"]
exclude = ["/.ai-assurance", "/.beads", "/site", "/.data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tools", "scripts", "src"]
